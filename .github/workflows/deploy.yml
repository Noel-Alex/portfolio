name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify and build
        run: npm run check
        env:
          # tags every analytics event with the deploy it came from
          VITE_BUILD: ${{ github.sha }}
      - name: Regenerate résumé PDF from the current profile
        run: |
          npm run resume
          cp public/Noel-Alex-Resume.pdf dist/Noel-Alex-Resume.pdf
          test -s dist/Noel-Alex-Resume.pdf
          pdftotext dist/Noel-Alex-Resume.pdf - | grep -q 'Vellore Institute of Technology'
          if pdftotext dist/Noel-Alex-Resume.pdf - | grep -E 'CGPA 8\\.23|92\\.6%|89\\.2%'; then
            echo 'ERROR: published résumé contains grades that were removed from the source' >&2
            exit 1
          fi
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
