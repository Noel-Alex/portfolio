<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1a33" />
    <meta name="description" content="Noel Alex: AI engineer and data science student (VIT Vellore, 2027). Rust crawlers, a parallelizing compiler, GPU-served OCR and careful ML evaluation. Read the portfolio, or explore it as a Minecraft world." />
    <meta property="og:title" content="Noel Alex" />
    <meta property="og:description" content="AI engineer and data science student. Rust crawlers, compilers, OCR pipelines and ML evaluation, measured honestly." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://noel-alex.github.io/portfolio/assets/minecraft-cave.webp" />
    <link rel="icon" href="/portfolio/favicon.svg" type="image/svg+xml" />
        <title>Noel Alex</title>
    <link rel="preload" href="/portfolio/fonts/monocraft.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Paint the right backdrop before any bundle arrives. Mirrors the game routes in src/ui/router.ts.
      (function () {
        var d = document.documentElement
        var game = /\/(play|world|mods|multiplayer|work|options)(\/|$)/.test(location.pathname)
        d.dataset.app = game ? 'game' : 'site'
        if (game) d.dataset.boot = ''
      })()
    </script>
    <style>
      html[data-app='site'] { background: #f3efe4; }
      html[data-app='game'] { background: #2b1d12; }
      @media (prefers-color-scheme: dark) { html[data-app='site'] { background: #111214; } }
      #boot { display: none; }
      html[data-boot] #boot {
        position: fixed; inset: 0; z-index: 9999; display: grid; place-content: center; justify-items: center; gap: 14px;
        background: #2b1d12 var(--tex-dirt, none) 0 0 / 128px 128px;
        font: 400 16px/1 'Monocraft', ui-monospace, monospace; color: #fff;
        transition: opacity 420ms cubic-bezier(0.16, 1, 0.3, 1);
        image-rendering: pixelated;
      }
      html[data-boot] #boot::before { content: ''; position: absolute; inset: 0; background: #0000008c; }
      #boot > * { position: relative; }
      #boot[data-out] { opacity: 0; pointer-events: none; }
      #boot b { font-weight: 400; text-shadow: 2px 2px 0 #3f3f3f; }
      #boot-bar { width: min(280px, 70vw); height: 10px; background: #000; border: 2px solid #000; box-shadow: 0 0 0 2px #00000080; }
      #boot-fill { height: 100%; background: #80ff20; box-shadow: inset 0 -3px 0 #4aa010, inset 0 3px 0 #b6ff7a; transform-origin: left; transform: scaleX(0.02); }
      #boot-pct { color: #a8a8a8; font-size: 14px; text-shadow: 2px 2px 0 #3f3f3f; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div id="boot" role="status" aria-label="Generating world">
      <b>Generating world</b>
      <div id="boot-bar"><div id="boot-fill"></div></div>
      <span id="boot-pct">0%</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
